[buildPlans.IosevkazFixed]
family = "Iosevkaz Fixed"
spacing = "fixed"
serifs = "sans"
noCvSs = false
exportGlyphNames = false

  [buildPlans.IosevkazFixed.variants]
  inherits = "ss12"

    [buildPlans.IosevkazFixed.variants.design]
    capital-a = "curly-serifless"
    capital-g = "toothless-corner-serifless-hooked"
    capital-v = "curly-serifless"
    capital-w = "curly-serifless"
    e = "rounded"
    v = "curly-serifless"
    w = "curly-serifless"
    lower-alpha = "crossing"
    paren = "large-contour"
    brace = "curly"
    at = "compact"
    dollar = "interrupted"
    cent = "bar-interrupted"
    percent = "rings-continuous-slash"
    bar = "natural-slope"

[buildPlans.IosevkazFixed.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkazFixed.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkazFixed.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.IosevkazFixed.widths.Condensed]
shape = 500
menu = 3
css = "condensed"

[buildPlans.IosevkazFixed.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.IosevkazFixed.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkazFixed.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
